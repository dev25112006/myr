services:
  - type: web
    name: myr-production
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin.demo@example.com"
      - key: ADMIN_PASSWORD
        value: "MyrAdminDemo#2026"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: "akashsri5443@gmail.com"
      - key: SMTP_PASS
        value: "pjkarwgokfxbvkzx"
      - key: SMTP_FROM
        value: "akashsri5443@gmail.com"
      - key: VITE_TURNSTILE_SITE_KEY
        value: 0x4AAAAAAFzMayG1z7fkefc0
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: AUTH_TURNSTILE_REQUIRED
        value: "false"
      - key: VITE_AUTH_TURNSTILE_REQUIRED
        value: "false"
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: PAYU_ENV
        value: production
