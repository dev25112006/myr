services:
  - type: web
    name: myr-production
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        value: 0x4AAAAAAFzMayG1z7fkefc0
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: AUTH_TURNSTILE_REQUIRED
        value: "false"
      - key: VITE_AUTH_TURNSTILE_REQUIRED
        value: "false"
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: PAYU_ENV
        value: production
