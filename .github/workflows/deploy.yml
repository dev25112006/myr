name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Never run two deploys at once; do not cancel an in-flight deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1. Verify the build before touching the server.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # 2. SSH into the VPS and run the deploy script.
  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ] || [ -z "${USER}" ] || [ -z "${SSH_KEY}" ]; then
            echo "Missing VPS_HOST / VPS_USER / VPS_SSH_KEY repository secrets." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new \
              "${USER}@${HOST}" 'cd ~/myr && bash scripts/deploy.sh'
